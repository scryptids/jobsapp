name: Deploy

# Builds the image, pushes it to ECR and deploys the CDK stacks. ECS then
# runs the blue/green deployment (writer handoff, bake, alarm rollback);
# `cdk deploy` waits for it to finish.
#
# Repository setup (Settings → Environments → production):
#   - required reviewers (manual approval before each deploy)
#   - variables: AWS_ACCOUNT_ID, AWS_REGION, DOMAIN_NAME, HOSTED_ZONE_ID,
#     HOSTED_ZONE_NAME, ALARM_EMAIL
# The JobsappCi stack (OIDC role, ECR) is deployed once by an admin; see
# docs/operations/deployment.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/jobsapp-github-deploy
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/jobsapp:${{ env.IMAGE_TAG }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            infra/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: infra

      - name: Deploy stacks
        working-directory: infra
        run: >
          npx cdk deploy --exclusively JobsappData JobsappApp JobsappOps
          --require-approval never
          --progress events
          -c jobsapp:imageTag=$IMAGE_TAG
          -c jobsapp:domainName=${{ vars.DOMAIN_NAME }}
          -c jobsapp:hostedZoneId=${{ vars.HOSTED_ZONE_ID }}
          -c jobsapp:hostedZoneName=${{ vars.HOSTED_ZONE_NAME }}
          -c jobsapp:alarmEmail=${{ vars.ALARM_EMAIL }}
