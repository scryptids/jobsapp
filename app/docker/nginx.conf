# Runs unprivileged (user `node`) with a read-only root filesystem: every
# writable path is under /tmp/nginx. TLS terminates at the ALB.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  log_format json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstream":"$upstream_response_time","ua":"$http_user_agent",'
    '"xff":"$http_x_forwarded_for","trace":"$http_x_amzn_trace_id"}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  server_tokens off;
  keepalive_timeout 65s;  # longer than the ALB idle timeout (60s)
  client_max_body_size 1m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  upstream app {
    server 127.0.0.1:3000;
    keepalive 16;
  }

  map $request_uri $hsts {
    default "max-age=31536000; includeSubDomains";
  }

  server {
    listen 8080 default_server;
    server_name _;

    # Security headers for every response (including errors).
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # React Router inlines its hydration script and Mantine injects styles,
    # hence 'unsafe-inline'; tighten with nonces later.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Fingerprinted build assets.
    location /assets/ {
      root /app/build/client;
      access_log off;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location = /favicon.ico {
      root /app/build/client;
      access_log off;
      expires 1d;
    }

    # Internal endpoints are loopback-only (served by node directly).
    location /_internal/ {
      return 404;
    }

    location = /healthz {
      access_log off;
      proxy_pass http://app;
    }

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 60s;
    }
  }
}
