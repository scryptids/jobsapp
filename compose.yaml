# Local production-like stack: two app containers sharing one S3 bucket
# (LocalStack, which supports the conditional writes the writer protocol
# needs), to exercise writer handoff, crash recovery and point-in-time restore.
#
#   docker compose up --build -d
#   ./app/tools/handoff-test.sh
#   docker compose down -v
#
# app-a: http://localhost:18081   app-b: http://localhost:18082 (profile "b")

x-app: &app
  build: ./app
  read_only: true
  tmpfs:
    - /tmp
  environment: &app-env
    COOKIE_SECRETS: local-compose-secret
    INSECURE_COOKIES: "true"
    WRITER_COORDINATION: s3
    REPLICA_BUCKET: jobsapp-local
    S3_ENDPOINT: http://s3:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
  depends_on:
    bucket:
      condition: service_completed_successfully
  stop_grace_period: 90s

services:
  s3:
    image: localstack/localstack:4.9
    environment:
      SERVICES: s3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 2s
      retries: 30

  bucket:
    image: amazon/aws-cli:2.31.0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    entrypoint:
      - sh
      - -c
      - >-
        (aws --endpoint-url http://s3:4566 s3 mb s3://jobsapp-local || true) &&
        aws --endpoint-url http://s3:4566 s3api put-bucket-versioning --bucket jobsapp-local --versioning-configuration Status=Enabled

  app-a:
    <<: *app
    ports: ["18081:8080"]
    environment:
      <<: *app-env
      TASK_ID: app-a
      TASK_DEFINITION: local:1
    volumes: [data-a:/data]

  app-b:
    <<: *app
    profiles: [b]
    ports: ["18082:8080"]
    environment:
      <<: *app-env
      TASK_ID: app-b
      TASK_DEFINITION: local:2
    volumes: [data-b:/data]

  # One-off operator commands, like the runbooks' ECS tasks:
  #   docker compose run --rm ops status
  ops:
    <<: *app
    profiles: [ops]
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/entrypoint.sh", "ops"]
    command: ["status"]
    environment:
      <<: *app-env
      TASK_ID: ops-local
      TASK_DEFINITION: ops:1
    volumes: [data-ops:/data]

volumes:
  data-a:
  data-b:
  data-ops:
