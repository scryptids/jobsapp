table:
  name: positions
  schema: public
object_relationships:
  - name: employer
    using:
      foreign_key_constraint_on: employer_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _or:
              - employer_id:
                  _is_null: true
              - employer:
                  user_id:
                    _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - employer_id
        - notes
        - pay_range_lower
        - pay_range_upper
        - posting_url
        - title
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - employer_id
        - id
        - notes
        - pay_range_lower
        - pay_range_upper
        - posting_url
        - title
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - employer_id
        - notes
        - pay_range_lower
        - pay_range_upper
        - posting_url
        - title
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      # Same employer-ownership rule as inserts, so a job can't be pointed at
      # another user's employer.
      check:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _or:
              - employer_id:
                  _is_null: true
              - employer:
                  user_id:
                    _eq: X-Hasura-User-Id
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
