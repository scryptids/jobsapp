query positions($limit: Int! = 10) {
  positions(
    limit: $limit
  ) {
    id
    title
    employer {
      name
    }
  }
}

query positionsPage($limit: Int!, $offset: Int!) {
  positions(limit: $limit, offset: $offset, order_by: { id: asc }) {
    id
    title
    employer {
      name
    }
  }
}
